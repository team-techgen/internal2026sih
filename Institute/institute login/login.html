<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Institute Login | Inclusive Queue</title>


    <!-- =========================
         HEADER CSS
    ========================== -->

    <link rel="stylesheet"
          href="../../header/header.css">


    <!-- =========================
         SIDEBAR CSS
    ========================== -->

    <link rel="stylesheet"
          href="../../sidebar/sidebar.css">


    <!-- =========================
         LOGIN CSS
    ========================== -->

    <link rel="stylesheet"
          href="login.css">


    <!-- =========================
         FOOTER CSS
    ========================== -->

    <link rel="stylesheet"
          href="../../footer/footer.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <div id="header"></div>


    <!-- =========================
         SIDEBAR
    ========================== -->

    <div id="sidebar"></div>


    <!-- =========================
         LOGIN
    ========================== -->

    <main class="login-page">

        <div class="login-card">

            <div class="login-header">

                <h1>
                    Institute Login
                </h1>

                <p>
                    Login to access your institute account
                </p>

            </div>


            <form
                class="login-form"
                id="loginForm"
                novalidate>


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username / Institute ID / Email
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username, ID or email"
                        autocomplete="username">

                    <small
                        class="input-error"
                        id="usernameError">
                    </small>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password">

                    <small
                        class="input-error"
                        id="passwordError">
                    </small>

                </div>


                <!-- CAPTCHA -->

                <div class="form-group">

                    <label for="captchaInput">
                        CAPTCHA
                    </label>

                    <div class="captcha-row">

                        <div
                            id="captchaCode"
                            class="captcha-code">
                        </div>

                        <button
                            type="button"
                            id="refreshCaptcha"
                            class="refresh-btn"
                            aria-label="Generate new CAPTCHA">

                            ↻

                        </button>

                    </div>

                    <input
                        type="text"
                        id="captchaInput"
                        name="captcha"
                        placeholder="Enter CAPTCHA"
                        autocomplete="off"
                        spellcheck="false">

                    <small
                        class="input-error"
                        id="captchaError">
                    </small>

                </div>


                <!-- OTP -->

                <div class="form-group">

                    <label>
                        OTP
                    </label>

                    <div
                        class="otp-row"
                        id="otpContainer">

                        <input
                            type="text"
                            class="otp-box"
                            maxlength="1"
                            inputmode="numeric"
                            aria-label="OTP digit 1">

                        <input
                            type="text"
                            class="otp-box"
                            maxlength="1"
                            inputmode="numeric"
                            aria-label="OTP digit 2">

                        <input
                            type="text"
                            class="otp-box"
                            maxlength="1"
                            inputmode="numeric"
                            aria-label="OTP digit 3">

                        <input
                            type="text"
                            class="otp-box"
                            maxlength="1"
                            inputmode="numeric"
                            aria-label="OTP digit 4">

                        <input
                            type="text"
                            class="otp-box"
                            maxlength="1"
                            inputmode="numeric"
                            aria-label="OTP digit 5">

                        <input
                            type="text"
                            class="otp-box"
                            maxlength="1"
                            inputmode="numeric"
                            aria-label="OTP digit 6">

                    </div>

                    <small
                        class="input-error"
                        id="otpError">
                    </small>


                    <button
                        type="button"
                        class="send-otp-btn"
                        id="sendOtpBtn">

                        Send OTP

                    </button>

                </div>


                <!-- FORGOT CREDENTIAL -->

                <button
                    type="button"
                    class="forgot-btn"
                    id="forgotCredentialBtn">

                    Forgot credentials?

                </button>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>


            <!-- REGISTER -->

            <div class="register-section">

                <p>
                    Don't have an institute account?
                </p>

                <button
                    type="button"
                    class="register-btn"
                    id="registerBtn">

                    Register

                </button>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <div id="footer"></div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <!-- Header -->
    <script src="../../header/header.js"></script>

    <!-- Sidebar -->
    <script src="../../sidebar/sidebar.js"></script>

    <!-- Footer -->
    <script src="../../footer/footer.js"></script>

    <!-- Login -->
    <script src="login.js"></script>


</body>

</html>
